services:
  db:
    container_name: vutf_db
    image: postgres:15
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" 
    volumes:
      - vutf_db_data:/var/lib/postgresql/data

  redis:
    container_name: vutf_redis
    image: redis:7
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - vutf_redis_data:/data

  adminer:
    container_name: vutf_adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  vutf_db_data:
  vutf_redis_data:
